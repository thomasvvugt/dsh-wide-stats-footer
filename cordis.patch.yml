# dsh-wide-stats-footer bundle layer: client-only plugin that un-clamps the
# composer stats footer width. The node half (index.js) is an empty apply —
# the row exists so the host Loader lists the plugin and composes its browser
# half (exports["./client"]) into window.__DSH_BOOT__.

- insert:
    - id: wide-stats-footer
      name: dsh-wide-stats-footer
